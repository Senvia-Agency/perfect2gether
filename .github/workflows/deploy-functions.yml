name: Deploy Edge Functions

# Faz deploy automático das Supabase Edge Functions sempre que algo em
# supabase/functions (ou o config.toml) muda no master — igual a Vercel faz
# com o frontend. Assim "fix no Git" passa a significar "fix em produção".

on:
  push:
    branches: [master]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      certificate_only:
        description: Apply and deploy client certificate integration only
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zycrksvkdpondqpplqce
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Apply client certificate migration
        if: inputs.certificate_only == true
        run: node scripts/deploy-client-certificate.mjs

      - name: Deploy client certificate function
        if: inputs.certificate_only == true
        run: supabase functions deploy lookup-client-certificate --project-ref "$PROJECT_REF" --use-api

      - name: Deploy todas as edge functions
        if: inputs.certificate_only != true
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
